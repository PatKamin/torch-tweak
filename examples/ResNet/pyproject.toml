[project]
name = "torch-tweak-resnet-example"
dynamic = ["version"]
description = "Torch Tweak ResNet Example"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "third-party-programs.txt"]
requires-python = ">=3.10"
dependencies = [
    "torch-tweak[xpu]",
    "torch>=2.13.0",
    "torchvision",
    "timm",
    "pillow>=12.3.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch_tweak = { path = "../../" }
torch = { index = "pytorch-xpu" }
torchvision = { index = "pytorch-xpu" }
torchao = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
tune = "resnet.tune:main"
inference = "resnet.inference:main"

[build-system]
requires = ["setuptools>=83.0.0", "setuptools_scm[toml]>=10.2.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools_scm]
root = "../.."
local_scheme = "no-local-version"
fallback_version = "0.4.0"

[tool.setuptools.packages.find]
namespaces = false
include = ["resnet"]

[tool.setuptools.package-data]
resnet = ["**/*"]
